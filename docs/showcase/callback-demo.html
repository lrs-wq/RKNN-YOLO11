<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RKNN YOLO11 · 回调接口示意</title><style>*{box-sizing:border-box}body{margin:0;color:#233246;background:#edf1f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1180px;margin:28px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:28px;margin:0 0 8px}p{color:#5e6c7c;line-height:1.65;margin:6px 0}.badge{border:1px solid #cdd7e2;background:white;border-radius:30px;padding:8px 16px;font-size:13px;white-space:nowrap}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}.panel{background:white;border:1px solid #d8e1e9;border-radius:14px;padding:22px}h2{font-size:17px;margin:0 0 16px}.controls{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}button{background:#255c87;border:0;border-radius:7px;color:white;padding:11px 17px;font:inherit;font-size:14px;cursor:pointer}button:hover{background:#174666}button:focus-visible{outline:3px solid #86b8e3;outline-offset:3px}button.secondary{background:#e8eef4;color:#25455e}pre{white-space:pre-wrap;background:#f2f5f8;color:#274259;padding:18px;border-radius:9px;font:13px/1.6 ui-monospace,Menlo,monospace;min-height:230px}svg{width:100%;height:auto;display:block}.note{font-size:13px;border-top:1px solid #dce4ec;margin-top:22px;padding-top:12px}.status{font-size:17px;color:#255c87;font-weight:650;min-height:28px}@media(max-width:780px){.layout{grid-template-columns:1fr}header{display:block}.badge{display:inline-block;margin-top:8px}}</style></head><body><main>
<header><div><h1>YOLO11 · 逐帧检测回调</h1><p>观察画面坐标如何变成 Python 业务可读取的对象。</p></div><span class="badge">合成数据 · 不运行 NPU 推理</span></header>
<div class="layout"><section class="panel"><h2>示意视频帧</h2><svg viewBox="0 0 640 380" aria-label="合成台球画面与检测框"><rect width="640" height="380" rx="14" fill="#193e3b"/><rect x="28" y="28" width="584" height="324" rx="18" fill="#29685d" stroke="#705440" stroke-width="18"/><g fill="#112b2a"><circle cx="40" cy="40" r="17"/><circle cx="320" cy="35" r="15"/><circle cx="600" cy="40" r="17"/><circle cx="40" cy="340" r="17"/><circle cx="320" cy="345" r="15"/><circle cx="600" cy="340" r="17"/></g><g id="objects"></g><text x="55" y="318" fill="#c3ded5" font-size="15">合成画面 · 检测分数仅用于说明接口格式</text></svg>
<div class="controls"><button id="play">播放示意</button><button id="next" class="secondary">下一帧</button><button id="reset" class="secondary">重置</button></div><p id="stage" class="status" aria-live="polite">frame_id = 0</p></section>
<section class="panel"><h2>on_frame(frame_id, detections)</h2><p>C++：std::vector&lt;PyDetection&gt;<br>Python：list[Detection]</p><pre id="payload"></pre><p class="note">右侧 JSON 是 Python 将回调参数整理后的展示格式。实际检测必须在匹配的 Rockchip 板卡、驱动、模型和 Python ABI 环境运行。</p></section></div></main>
<script>let frame=0,timer=null;const objs=document.getElementById('objects'),payload=document.getElementById('payload'),stage=document.getElementById('stage'),play=document.getElementById('play');
function draw(){const x=145+(frame*9)%225,y=150+Math.round(35*Math.sin(frame/8));const detections=[{id:0,prob:0.96,x1:x-21,y1:y-21,x2:x+21,y2:y+21},{id:1,prob:0.91,x1:429,y1:214,x2:471,y2:256}];objs.innerHTML=detections.map((d,i)=>`<circle cx="${(d.x1+d.x2)/2}" cy="${(d.y1+d.y2)/2}" r="15" fill="${i?'#e8ae3f':'#f4f1e9'}"/><rect x="${d.x1}" y="${d.y1}" width="42" height="42" fill="none" stroke="#78edcc" stroke-width="2"/><rect x="${d.x1}" y="${d.y1-26}" width="106" height="23" rx="3" fill="#112b2a"/><text x="${d.x1+5}" y="${d.y1-10}" font-size="13" fill="#b3ffeb">class ${d.id} · ${d.prob}</text>`).join('');payload.textContent='{\n  \"frame_id\": '+frame+',\n  \"detections\": [\n'+detections.map(d=>'    '+JSON.stringify(d)).join(',\n')+'\n  ]\n}\n\nid    类别编号\nprob  示例分数\nx1,y1 左上角像素坐标\nx2,y2 右下角像素坐标';stage.textContent='frame_id = '+frame+' · detections = 2';}
function stop(){if(timer)clearInterval(timer);timer=null;play.textContent='播放示意';}
play.onclick=()=>{if(timer){stop();return;}play.textContent='暂停示意';timer=setInterval(()=>{frame++;draw();},200);};document.getElementById('next').onclick=()=>{stop();frame++;draw();};document.getElementById('reset').onclick=()=>{stop();frame=0;draw();};draw();</script></body></html>
